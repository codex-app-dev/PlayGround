<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101722"><title>Glimmerdeep — The Sunken Shrine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <header class="masthead"><div class="brand"><div class="sigil">✦</div><div><h1>GLIMMERDEEP</h1><span>THE SUNKEN SHRINE</span></div></div><div class="chapter">A little dungeon adventure <b>· Chapter I</b></div></header>
  <section class="frame" aria-label="Glimmerdeep game"><canvas id="game" width="960" height="640" aria-label="Top-down dungeon game"></canvas>
    <div id="touch" class="touch-controls" aria-label="Touch controls">
      <div class="pad"><button data-key="ArrowUp" class="up" aria-label="Move up">▲</button><button data-key="ArrowLeft" class="left" aria-label="Move left">◀</button><button data-key="ArrowDown" class="down" aria-label="Move down">▼</button><button data-key="ArrowRight" class="right" aria-label="Move right">▶</button></div>
      <div class="actions"><button class="action" data-key="Space" aria-label="Attack">⚔</button><button class="interact" data-key="KeyE" aria-label="Interact">E</button></div>
    </div>
  </section>
  <footer class="footer"><div>MOVE <kbd>WASD</kbd> <kbd>↑↓←→</kbd><span class="sep">·</span>STRIKE <kbd>SPACE</kbd><span class="sep">·</span>INTERACT <kbd>E</kbd></div><div class="hint">Press <kbd>R</kbd> to restart</div></footer>
</main>
<script src="game.js"></script>
</body></html>
