<head>

<title>НОЧНОЙ РЕЙС — Taxi City</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--ink:#f4f4ed;--muted:#a6b0b5;--yellow:#f6cb59;--cyan:#7de5df;--panel:rgba(9,18,26,.76)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;color:var(--ink);font-family:Manrope,system-ui,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%;display:block}.vignette{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(1,7,12,.18) 100%),linear-gradient(180deg,rgba(0,0,0,.18),transparent 25%,transparent 72%,rgba(0,0,0,.48))}.topbar{position:fixed;z-index:2;top:24px;left:28px;right:28px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:12px;text-shadow:0 2px 12px #000}.brand-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--yellow);color:#151712;font-weight:900;font-size:20px;box-shadow:0 0 24px #f6cb5930}.brand-name{font-size:13px;letter-spacing:.22em;font-weight:800}.brand-sub{font:10px 'DM Mono',monospace;color:#b5c3c4;letter-spacing:.14em;margin-top:3px}.top-right{display:flex;gap:10px;align-items:center}.pill{border:1px solid #ffffff20;background:rgba(7,15,21,.68);backdrop-filter:blur(10px);padding:10px 14px;border-radius:99px;color:#d4dcd8;font:11px 'DM Mono',monospace;letter-spacing:.08em}.pill b{color:var(--yellow);font-weight:500}.panel{position:fixed;z-index:2;background:var(--panel);border:1px solid #ffffff1b;backdrop-filter:blur(14px);box-shadow:0 15px 50px #0003;border-radius:16px}.mission{top:92px;left:28px;width:272px;padding:17px 18px}.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}.mission-title{font-size:18px;font-weight:800;margin:8px 0 5px}.mission-copy{font-size:12px;color:#b6c1c4;line-height:1.55}.stats{display:flex;gap:20px;margin-top:14px;padding-top:12px;border-top:1px solid #ffffff16}.stat small{display:block;color:#9da9ac;font:9px 'DM Mono',monospace;letter-spacing:.1em}.stat b{display:block;font:16px 'DM Mono',monospace;color:#f5f2e7;margin-top:4px}.mapbox{position:fixed;z-index:2;right:28px;top:92px;width:184px;padding:10px;border-radius:16px;background:rgba(7,15,21,.78);border:1px solid #ffffff20;backdrop-filter:blur(12px)}.map-head{display:flex;justify-content:space-between;margin:1px 3px 8px;color:#b1bec0;font:9px 'DM Mono',monospace;letter-spacing:.12em}.map-head strong{color:var(--yellow);font-weight:500}#map{display:block;width:162px;height:162px;border-radius:9px;background:#101b22}.tip{position:fixed;left:28px;bottom:25px;z-index:2;padding:11px 14px;color:#bdc8c8;font-size:11px;letter-spacing:.02em}.key{display:inline-grid;place-items:center;height:23px;min-width:24px;padding:0 6px;margin-right:4px;border:1px solid #ffffff30;border-radius:6px;background:#ffffff0b;color:#f4f4ed;font:10px 'DM Mono',monospace}.right-bottom{position:fixed;right:28px;bottom:25px;z-index:2;text-align:right;color:#9eacad;font:9px 'DM Mono',monospace;letter-spacing:.12em}.speed{color:#f4f4ed;font-size:30px;letter-spacing:-.06em;font-weight:500}.speed small{font-size:10px;letter-spacing:.1em;color:#a8b4b5}.toast{position:fixed;z-index:5;left:50%;top:24%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;padding:13px 20px;border:1px solid #f6cb5950;background:#111b20eF;border-radius:12px;text-align:center;transition:.3s;box-shadow:0 8px 35px #0006}.toast.show{opacity:1;transform:translate(-50%,0)}.toast b{display:block;color:var(--yellow);font-size:14px;letter-spacing:.08em}.toast span{display:block;color:#c2cacc;font-size:11px;margin-top:4px}.touch{display:none;position:fixed;inset:0;z-index:3;pointer-events:none}.pad{position:absolute;bottom:25px;width:62px;height:62px;border-radius:50%;background:#102029a8;border:1px solid #ffffff40;color:#f5f2e7;display:grid;place-items:center;font-size:19px;pointer-events:auto;touch-action:none;user-select:none}.pad:active{background:#e8c34a88}.leftpad{left:18px}.rightpad{right:18px}.up{right:91px;bottom:94px}.down{right:91px;bottom:25px}.left{right:163px;bottom:25px}.right{right:19px;bottom:94px}.controls-label{position:absolute;right:30px;bottom:170px;font:9px 'DM Mono';color:#ffffff9a;letter-spacing:.1em}
@media(max-width:700px){.topbar{top:14px;left:14px;right:14px}.brand-mark{width:36px;height:36px}.brand-name{font-size:11px}.brand-sub{font-size:8px}.pill{padding:8px 10px;font-size:9px}.mission{top:67px;left:14px;width:calc(100% - 155px);max-width:250px;padding:12px 13px}.mission-title{font-size:15px;margin:6px 0 3px}.mission-copy{font-size:10px}.stats{margin-top:9px;padding-top:8px;gap:14px}.stat b{font-size:13px}.mapbox{top:67px;right:14px;width:128px;padding:7px}.map-head{font-size:8px;margin-bottom:5px}#map{width:112px;height:112px}.tip{display:none}.right-bottom{right:14px;bottom:185px}.speed{font-size:24px}.touch{display:block}.controls-label{display:none}}
@media(max-height:520px) and (min-width:701px){.mission{top:75px}.mapbox{top:75px}.tip{bottom:12px}.right-bottom{bottom:12px}}
</style>
</head>
<body>
<canvas id="scene"></canvas><div class="vignette"></div>
<div class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">НОЧНОЙ РЕЙС</div><div class="brand-sub">TAXI CITY • 02:17 AM</div></div></div><div class="top-right"><div class="pill">РАЙОН <b>ЦЕНТР</b></div><div class="pill">● <b>В ЭФИРЕ</b></div></div></div>
<section class="panel mission"><div class="eyebrow" id="mission-tag">СВОБОДНАЯ СМЕНА</div><div class="mission-title" id="mission-title">Ищем пассажира</div><div class="mission-copy" id="mission-copy">Следуй к золотому маркеру. Подбери клиента и отвези его в точку назначения.</div><div class="stats"><div class="stat"><small>ЗАРАБОТАНО</small><b id="cash">$ 0</b></div><div class="stat"><small>РЕЙСЫ</small><b id="rides">00</b></div></div></section>
<div class="mapbox"><div class="map-head"><span>КАРТА ГОРОДА</span><strong>● LIVE</strong></div><canvas id="map" width="324" height="324"></canvas></div>
<div class="panel tip"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> ехать <span class="key">SPACE</span> ручник <span class="key">R</span> заново</div>
<div class="right-bottom"><div class="speed"><span id="speed">000</span> <small>КМ/Ч</small></div><div id="bearing">N • ЦЕНТР</div></div>
<div class="toast" id="toast"><b id="toast-title">КЛИЕНТ НАЙДЕН</b><span id="toast-copy">Отвези пассажира</span></div>
<div class="touch"><div class="controls-label">УПРАВЛЕНИЕ</div><button class="pad left" data-key="a">◀</button><button class="pad right" data-key="d">▶</button><button class="pad up" data-key="w">▲</button><button class="pad down" data-key="s">▼</button></div>
<script type="module" src="./game.js"></script>
</body></html>
