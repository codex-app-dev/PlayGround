<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wall Jump Runner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div>
          <span class="label">Coins</span>
          <span id="coinCount">0/7</span>
        </div>
        <div>
          <span class="label">Lives</span>
          <span id="lives">3</span>
        </div>
        <div>
          <span class="label">Goal</span>
          <span id="status">Collect all coins</span>
        </div>
      </header>

      <canvas id="game" width="960" height="540" aria-label="Platformer game canvas"></canvas>
      <p class="instructions">Move with <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd>/<kbd>D</kbd> · Jump with <kbd>↑</kbd>, <kbd>W</kbd>, or <kbd>Space</kbd> · Press jump against a wall to wall-jump</p>

      <div class="touch-controls" aria-label="Touch controls">
        <div class="left-right">
          <button data-key="ArrowLeft">◀</button>
          <button data-key="ArrowRight">▶</button>
        </div>
        <button class="jump" data-key="ArrowUp">Jump</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
