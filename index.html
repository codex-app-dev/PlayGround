<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tropic Heat</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="panel left">
        <div class="title">TROPIC HEAT</div>
        <div id="mission">Mission: Reach the marina</div>
        <div id="status">Live: Island free</div>
      </div>

      <div class="panel right">
        <div class="cash-row"><span>Cash</span><strong id="money">$0</strong></div>
        <div class="cash-row"><span>Heat</span><strong id="heat">Low</strong></div>
      </div>

      <div id="controls">
        <span>WASD Move</span>
        <span>Shift Sprint</span>
        <span>E Enter/Exit</span>
        <span>F Grab cash</span>
        <span>Q / E Rotate cam</span>
      </div>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
